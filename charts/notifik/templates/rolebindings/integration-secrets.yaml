{{- if .Values.controller.integrationSecrets.rbac.create }}
{{- range $namespace := .Values.controller.integrationSecrets.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "notifik.fullname" $ }}-integration-secrets
  namespace: {{ $namespace }}
  labels:
    {{- include "notifik.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "notifik.fullname" $ }}-integration-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "notifik.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
