{{- if .Values.controller.integrationSecrets.rbac.create }}
{{- range $namespace := .Values.controller.integrationSecrets.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "notifik.fullname" $ }}-integration-secrets
  namespace: {{ $namespace }}
  labels:
    {{- include "notifik.labels" $ | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
{{- end }}
{{- end }}
